<script>

const flipbook = $(".flipbook");

// Name → Multiple Pages mapping
let pageMap = {};

$(".flipbook > div").each(function (index) {
  const namesAttr = $(this).attr("data-names");

  if (namesAttr) {
    const namesArray = namesAttr.split(",");

    namesArray.forEach(name => {
      const cleanName = name.trim().toLowerCase();

      // Create array if not exist
      if (!pageMap[cleanName]) {
        pageMap[cleanName] = [];
      }

      // Store page number
      pageMap[cleanName].push(index + 1);
    });
  }
});

// Initialize turn.js
flipbook.turn();

flipbook.bind("turning", function (event, page) {
  const totalPages = flipbook.turn("pages");

  if (page === 1 || page === totalPages) {
    flipbook.removeClass("shadow-active");
  } else {
    flipbook.addClass("shadow-active");
  }
});

// Track which result user is currently viewing
let currentResultIndex = {};

function goToUserPage() {
  const inputName = document
    .getElementById("searchID")
    .value
    .trim()
    .toLowerCase();

  if (pageMap[inputName]) {

    // First time searching this user
    if (currentResultIndex[inputName] === undefined) {
      currentResultIndex[inputName] = 0;
    } else {
      // Next result each search click
      currentResultIndex[inputName]++;

      // Loop back to first page
      if (currentResultIndex[inputName] >= pageMap[inputName].length) {
        currentResultIndex[inputName] = 0;
      }
    }

    const pageToOpen =
      pageMap[inputName][currentResultIndex[inputName]];

    flipbook.turn("page", pageToOpen);

  } else {
    alert("Name not found!");
  }
}

</script>
 
  <div class="audio-controls">
  <button id="playPauseBtn">⏸</button>
  <input type="range" id="volumeSlider" min="0" max="0.5" step="0.01" value="0.1">
</div>
<script>
  const bgm = document.getElementById("bgm");
  const playPauseBtn = document.getElementById("playPauseBtn");
  const volumeSlider = document.getElementById("volumeSlider");

  // Default volume
  bgm.volume = 0.2;

  // Autoplay handling
  bgm.play().catch(() => {
    document.addEventListener("click", () => {
      bgm.play();
    }, { once: true });
  });

  // Play / Pause toggle
  playPauseBtn.addEventListener("click", () => {
    if (bgm.paused) {
      bgm.play();
      playPauseBtn.textContent = "⏸";
    } else {
      bgm.pause();
      playPauseBtn.textContent = "▶";
    }
  });

  // Volume control
  volumeSlider.addEventListener("input", () => {
    bgm.volume = volumeSlider.value;
  });

  document.getElementById("searchID").addEventListener("keypress", function (event) {
  if (event.key === "Enter") {
    event.preventDefault(); // prevents any default behavior
    goToUserPage();
  }
});
</script>
